services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./server/.env
    environment:
      MONGO_URL: "mongodb://mongo:27017/portfolio"
    ports:
      - "8080:8080"

volumes:
  mongo-data:
