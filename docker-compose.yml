services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: "8080"
      MONGO_URL: "mongodb://mongo:27017/portfolio"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-http://localhost:5173}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-secret}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_CALLBACK_URL: "${GITHUB_CALLBACK_URL:-http://localhost:5173/auth/github/callback}"
      ADMIN_LOGIN: "${ADMIN_LOGIN:-your-github-username}"
    ports:
      - "8080:8080"

volumes:
  mongo-data:
