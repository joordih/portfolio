<div class="wrap">
  <div class="fields">
    <div class="field">
      <label>TITLE</label>
      <input type="text" data-title placeholder="Post title" />
    </div>
    <div class="field">
      <label>SLUG</label>
      <input type="text" data-slug placeholder="post-slug" />
    </div>
    <div class="field">
      <label>STATUS</label>
      <select data-status>
        <option value="draft">draft</option>
        <option value="published">published</option>
      </select>
    </div>
  </div>
  <div class="toolbar" data-toolbar></div>
  <div class="editor" data-editor></div>
  <div class="actions">
    <button type="button" class="cancel-btn" data-cancel>Cancel</button>
    <button type="button" class="save-btn" data-save>Save</button>
  </div>
</div>
