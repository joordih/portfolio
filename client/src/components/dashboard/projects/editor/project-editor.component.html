<div class="form">
  <h2 class="form__title" data-form-title>New project</h2>
  <p class="form__note" data-github-note hidden>Linked to GitHub. Title and URL sync from the repository import flow.</p>
  <label class="field">
    <span class="field__label">Published</span>
    <input type="checkbox" data-published checked />
  </label>
  <label class="field">
    <span class="field__label">Number label</span>
    <input class="field__input" type="text" data-num placeholder="01" />
  </label>
  <label class="field">
    <span class="field__label">Sort order</span>
    <input class="field__input" type="number" data-order min="1" />
  </label>
  <label class="field">
    <span class="field__label">Title</span>
    <input class="field__input" type="text" data-title required />
  </label>
  <label class="field">
    <span class="field__label">URL</span>
    <input class="field__input" type="url" data-url required />
  </label>
  <label class="field">
    <span class="field__label">Description</span>
    <textarea class="field__input field__textarea" rows="4" data-description required></textarea>
  </label>
  <label class="field">
    <span class="field__label">Languages (comma-separated)</span>
    <input class="field__input" type="text" data-languages placeholder="Swift, TypeScript" />
  </label>
  <label class="field">
    <span class="field__label">Tech stack (comma-separated)</span>
    <input class="field__input" type="text" data-tech-stack placeholder="Vapor, MongoDB" />
  </label>
  <label class="field">
    <span class="field__label">Tags (comma-separated)</span>
    <input class="field__input" type="text" data-tags placeholder="Java, Neo4j, Maven" />
  </label>
  <div class="form__actions">
    <button type="button" class="ghost-btn" data-cancel>Cancel</button>
    <button type="button" class="save-btn" data-save>Save</button>
  </div>
</div>
